[project]
name = "reach"
version = "0.1.0"
description = "Offline training, export and parity fixtures for the sim2browser reach demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.14.0",
    "numpy",
    "gymnasium",
    "stable-baselines3",
    "torch",
]

[dependency-groups]
dev = ["pytest", "ruff"]
# Asset tooling only (mesh decimation, research R10 mitigation); never needed at runtime.
tools = ["trimesh", "fast-simplification"]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reach"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
