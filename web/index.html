<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A robot arm in your browser, controlled live." />
    <title>web-robot</title>
  </head>
  <body>
    <main id="app">
      <canvas
        id="view"
        aria-label="3D view of a robot arm. Drag the arm to pose its joints; drag elsewhere to orbit."
      ></canvas>
      <header class="brand">
        <h1>web-robot</h1>
        <p>Drag the blue target — the arm follows</p>
      </header>
      <div class="toolbar" id="toolbar"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
