name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace web
      - run: npm test --workspace web
      - run: npm run build --workspace web
      - run: npm run size --workspace web
      # SC-003: the shipped baseline must settle on >= 99% of 100 seeded reachable targets.
      - run: npm run eval --workspace web -- --controller baseline --n 100 --seed 0
      - uses: actions/upload-artifact@v4
        with:
          name: eval-baseline
          path: web/eval/baseline.json
      # SC-004 / SC-009: evaluate the shipped policy and report the comparison (never fails the
      # build on a shortfall: research R12 reports it honestly instead).
      - run: npm run eval --workspace web -- --controller learned --n 100 --seed 0
      - run: npm run eval:compare --workspace web
      - uses: actions/upload-artifact@v4
        with:
          name: eval-learned
          path: web/eval/learned.json
      # 002 FR-015/FR-016: the grasp numbers the info panel shows must be exactly what the shipped
      # grasp controller measures (a miss of SC-003/SC-004 is reported, not failed).
      - run: npm run eval:grasp --workspace web -- --check
      - uses: actions/upload-artifact@v4
        with:
          name: eval-grasp
          path: shared/grasp-eval.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: web/dist

  training:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Release gate (Principle II): versions, 1e-6 trajectory and 1e-5 policy parity.
      - run: npm run test:parity

  e2e:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
        working-directory: web
      # Release checks for every rung: static-only (constitution gate 3) and the rung's e2e tags.
      # CI=true: load-time and fps are recorded, not asserted (no GPU on runners; see p1.spec.ts).
      - run: npx playwright test --grep "@p1|@p2|@p3|@g1|@g2|@g3"
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  deploy:
    # Public deploy (constitution gate 4). Runs only on main once the repo has GitHub Pages
    # configured to deploy from Actions; blocked by every test job, including parity.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [web, training, parity, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
